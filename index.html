<div id="app"></div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="actionSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-sub" id="sheetSub"></div>
  </div>
  <div class="sheet-actions">
    <button class="sheet-btn sheet-btn-cash" data-sheet-action="cash" type="button">
      <div class="sheet-btn-icon">💵</div>
      <div class="sheet-btn-body">
        <strong>Bayar Cash</strong>
        <span>Tanya stok &amp; harga cash via WhatsApp</span>
      </div>
    </button>
    <button class="sheet-btn sheet-btn-kredit" data-sheet-action="kredit" type="button">
      <div class="sheet-btn-icon">📊</div>
      <div class="sheet-btn-body">
        <strong>Simulasi Kredit</strong>
        <span>Lihat cicilan per tenor dulu</span>
      </div>
    </button>
  </div>
  <button class="sheet-cancel" id="sheetCancel" type="button">Batal</button>
</div>
