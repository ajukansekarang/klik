<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dion Prayoga — Sales Honda Bandung</title>
<meta name="theme-color" content="#f5f5f7">
<style>
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --label:#1d1d1f;
  --label-2:#6e6e73;
  --label-3:#86868b;
  --separator:rgba(0,0,0,0.06);
  --fill:rgba(120,120,128,0.08);
  --accent:#ff9f0a;
  --accent-2:#ff8500;
  --accent-soft:rgba(255,159,10,0.12);
  --wa:#25d366;
  --wa-glass:rgba(37,211,102,0.92);
  --glass-blur:blur(24px) saturate(180%);
  --glass-blur-sm:blur(16px) saturate(180%);
  --shadow-1:0 1px 2px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.04);
  --shadow-2:0 2px 8px rgba(0,0,0,0.06),0 12px 32px rgba(0,0,0,0.06);
  --shadow-3:inset 0 1px 0 rgba(255,255,255,0.35),0 8px 24px rgba(37,211,102,.35),0 2px 8px rgba(0,0,0,.12);
  --radius:18px;
  --radius-pill:999px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --nav-duration:420ms;
  --nav-easing:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.45;color:var(--label);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;overscroll-behavior:none;
  font-size:15px;letter-spacing:-0.01em;
}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
button,a{touch-action:manipulation}
button{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ==== SCREEN STRUCTURE ==== */
.screen{
  position:absolute;inset:0;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 15% 3%,rgba(255,159,10,0.04) 0%,transparent 40%),
    radial-gradient(ellipse at 85% 97%,rgba(88,86,214,0.03) 0%,transparent 40%),
    var(--bg);
  transform:translateX(100%);
  visibility:hidden;
  will-change:transform;
  transition:
    transform var(--nav-duration) var(--nav-easing),
    visibility 0s linear var(--nav-duration);
}
.screen.is-active{transform:translateX(0);visibility:visible;transition:transform var(--nav-duration) var(--nav-easing),visibility 0s linear 0s}
.screen.is-behind{transform:translateX(-25%);visibility:visible;transition:transform var(--nav-duration) var(--nav-easing),visibility 0s linear 0s}
.screen:not(.is-active){pointer-events:none}
.screen.no-transition{transition:none!important}
.screen-inner{position:relative;width:100%;will-change:transform}

/* ==== REVEAL (scroll) ==== */
.reveal{opacity:0;transform:translateY(24px);will-change:opacity,transform}
.no-anim .reveal{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1!important;transform:none!important}
  *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
}

/* ==== LAYOUT ==== */
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
section{padding:26px 0 0}
.section-head{padding:0 0 14px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--label);line-height:1.2}
.section-sub{font-size:13.5px;color:var(--label-2);margin-top:4px;letter-spacing:-.005em;line-height:1.4}

/* ==== HERO ==== */
.hero{
  background:
    radial-gradient(ellipse at 75% 10%,rgba(255,159,10,0.32) 0%,transparent 55%),
    radial-gradient(ellipse at 15% 90%,rgba(255,120,0,0.18) 0%,transparent 45%),
    linear-gradient(180deg,#1c1c1e 0%,#2c2c2e 100%);
  color:#fff;
  padding:calc(22px + env(safe-area-inset-top)) 0 32px;
  position:relative;overflow:hidden;
  border-bottom-left-radius:28px;
  border-bottom-right-radius:28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.14);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,0.09) 0%,transparent 55%);
}
.hero-blob{
  position:absolute;top:-40%;right:-30%;
  width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,159,10,0.4) 0%,transparent 70%);
  filter:blur(50px);pointer-events:none;
  animation:blobFloat 26s ease-in-out infinite;
  will-change:transform;
}
@keyframes blobFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(-30px,40px) scale(1.1)}
  50%{transform:translate(20px,60px) scale(0.9)}
  75%{transform:translate(40px,20px) scale(1.05)}
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px;position:relative;z-index:1}
.hero-profile{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.profile-avatar{
  width:48px;height:48px;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#ffb84d 0%,#ff8500 100%);
  color:#fff;display:grid;place-items:center;
  font-size:20px;font-weight:700;flex-shrink:0;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.35),0 4px 12px rgba(255,159,10,.35);
}
.profile-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.profile-info{min-width:0}
.profile-info strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-info span{display:block;font-size:11.5px;color:rgba(255,255,255,.62);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,0.1);
  border:0.5px solid rgba(255,255,255,0.18);
  padding:5px 10px;border-radius:var(--radius-pill);
  font-size:11px;font-weight:600;flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);-webkit-backdrop-filter:var(--glass-blur-sm);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15);
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 8px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}
.hero h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.035em;margin-bottom:10px;position:relative;z-index:1}
.hero p{font-size:15px;color:rgba(255,255,255,.72);margin-bottom:24px;line-height:1.45;position:relative;z-index:1;letter-spacing:-.005em}
.hero-cta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:#1c1c1e;font-weight:700;font-size:16px;letter-spacing:-.01em;
  padding:16px;border-radius:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 1px 2px rgba(0,0,0,0.1),0 6px 20px rgba(255,159,10,0.32);
  transition:transform .2s var(--spring),box-shadow .2s;cursor:pointer;position:relative;z-index:1;
}
.hero-cta:active{transform:scale(.97);box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 2px 6px rgba(255,159,10,0.3)}
.hero-cta.is-loading{color:transparent!important}
.hero-cta.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.2);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.is-loading{pointer-events:none;position:relative;color:transparent!important}
.is-loading::after{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);border-top-color:var(--label);
  animation:spin .7s linear infinite;
}
.wa-btn.is-loading::after{border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* ==== SOCIAL ==== */
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.social{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:15px 8px;border-radius:16px;
  background:var(--surface);
  border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;
}
.social:active{transform:scale(.94)}
@media (hover:hover){.social:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}}
.social-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.social-icon svg{width:19px;height:19px}
.social-tiktok .social-icon{background:#000}
.social-ig .social-icon{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.social-yt .social-icon{background:#ff0000}
.social span{font-size:11px;font-weight:600;color:var(--label);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ==== ACTIONS ==== */
.actions{display:grid;gap:10px}
.action{
  display:flex;align-items:center;gap:14px;padding:16px;
  border-radius:var(--radius);
  background:var(--surface);
  border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;
}
.action:active{transform:scale(.98)}
@media (hover:hover){.action:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}}
.action-ico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.action-body{flex:1;min-width:0}
.action-body strong{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em;color:var(--label);line-height:1.25}
.action-body span{display:block;font-size:13px;color:var(--label-2);margin-top:2px;letter-spacing:-.005em;line-height:1.35}
.action-arrow{color:var(--label-3);font-size:20px;font-weight:300}

/* ==== MODEL CARDS ==== */
.models{display:grid;gap:14px}
.model{
  border-radius:var(--radius);overflow:hidden;
  background:var(--surface);
  border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;display:block;
}
.model:active{transform:scale(.98)}
@media (hover:hover){.model:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}}
.model-img{
  height:150px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);
  font-size:56px;
}
.model-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-img .tag{
  position:absolute;top:12px;left:12px;
  background:rgba(255,159,10,0.94);
  backdrop-filter:var(--glass-blur-sm);-webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:10.5px;font-weight:800;
  padding:5px 10px;border-radius:var(--radius-pill);
  letter-spacing:.04em;z-index:2;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 2px 8px rgba(255,159,10,.35);
}
.model-img .tag.tag-dark{background:rgba(28,28,30,0.85);border-color:rgba(255,255,255,0.18)}
.model-body{padding:16px 18px 18px}
.model-body h3{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;color:var(--label);line-height:1.3}
.model-body p{font-size:13px;color:var(--label-2);margin-bottom:10px;line-height:1.45}
.model-body .model-price{font-size:15px;font-weight:700;color:var(--accent-2);margin-bottom:12px;letter-spacing:-.015em}
.model-btn{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:#1c1c1e;font-weight:700;font-size:14px;letter-spacing:-.015em;
  padding:11px 16px;border-radius:11px;width:100%;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 2px 6px rgba(255,159,10,.25);
}

/* ==== TRUST ==== */
.trust{
  border-radius:var(--radius);overflow:hidden;
  background:var(--surface);
  border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);
}
.trust-item{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.trust-item + .trust-item{border-top:0.5px solid var(--separator)}
.trust-ico{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.trust-item strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--label);line-height:1.3}
.trust-item span{display:block;font-size:13px;color:var(--label-2);margin-top:3px;line-height:1.45}

/* ==== TERMS ==== */
.terms{
  border-radius:var(--radius);padding:16px 18px;
  background:var(--surface);
  border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);
}
.terms h3{font-size:13px;font-weight:700;color:var(--label);letter-spacing:-.01em;margin-bottom:6px}
.terms p{font-size:12.5px;color:var(--label-2);line-height:1.55}

/* ==== DETAIL HEADER ==== */
.detail-header{
  position:sticky;top:0;z-index:10;
  background:rgba(245,245,247,0.78);
  backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 -0.5px 0 var(--separator);
  display:flex;align-items:center;padding:8px 12px;gap:6px;
  padding-top:calc(8px + env(safe-area-inset-top));
}
.back-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(120,120,128,0.1);
  border:0.5px solid rgba(255,255,255,0.4);
  display:grid;place-items:center;cursor:pointer;color:var(--label);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 1px 3px rgba(0,0,0,.05);
  transition:transform .2s var(--spring),background .15s;flex-shrink:0;
  backdrop-filter:var(--glass-blur-sm);-webkit-backdrop-filter:var(--glass-blur-sm);
}
.back-btn:active{background:rgba(120,120,128,0.18);transform:scale(.93)}
.detail-title{flex:1;font-size:16px;font-weight:700;text-align:center;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label)}

/* ==== MODEL HERO ==== */
.model-hero{
  height:240px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#fafafa,#eaeaec);font-size:100px;
}
.model-hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.model-hero .tag{
  position:absolute;top:20px;left:20px;
  background:rgba(255,159,10,0.94);
  backdrop-filter:var(--glass-blur-sm);-webkit-backdrop-filter:var(--glass-blur-sm);
  color:#fff;font-size:11px;font-weight:800;
  padding:6px 12px;border-radius:var(--radius-pill);z-index:2;letter-spacing:.03em;
  border:0.5px solid rgba(255,255,255,0.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4),0 2px 10px rgba(255,159,10,.3);
}
.model-hero .tag.tag-dark{background:rgba(28,28,30,0.85);border-color:rgba(255,255,255,0.18)}
.detail-h2{font-size:28px;font-weight:800;letter-spacing:-.035em;margin-bottom:4px;color:var(--label);line-height:1.15}
.detail-tagline{font-size:15px;color:var(--accent-2);font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
.detail-desc{font-size:14px;color:var(--label-2);margin-bottom:22px;line-height:1.55}
.detail-h3{font-size:17px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em;color:var(--label)}
.highlights{
  list-style:none;border-radius:var(--radius);padding:0;margin-bottom:22px;overflow:hidden;
  background:var(--surface);border:0.5px solid var(--separator);box-shadow:var(--shadow-1);
}
.highlights li{font-size:15px;color:var(--label);padding:15px 18px;display:flex;gap:12px;align-items:flex-start;line-height:1.4}
.highlights li + li{border-top:0.5px solid var(--separator)}
.highlights li::before{
  content:"✓";color:var(--accent-2);font-weight:800;flex-shrink:0;
  width:22px;height:22px;border-radius:50%;background:var(--accent-soft);
  display:grid;place-items:center;font-size:11px;margin-top:1px;
}
.cta-block{display:grid;gap:10px;margin-bottom:24px}

/* ==== BUTTONS ==== */
.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(180deg,#31d977 0%,#25d366 100%);
  color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em;
  padding:15px;border-radius:14px;
  transition:transform .2s var(--spring),box-shadow .2s;
  cursor:pointer;text-align:center;position:relative;border:none;width:100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 1px 2px rgba(0,0,0,0.08),0 6px 18px rgba(37,211,102,0.28);
}
.wa-btn:active{transform:scale(.97);box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 2px 8px rgba(37,211,102,0.22)}
.wa-btn.has-selection{
  background:linear-gradient(180deg,#1da851 0%,#148a3f 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.28),0 0 0 4px rgba(37,211,102,0.16),0 6px 18px rgba(37,211,102,0.4);
  animation:btnPulse .5s var(--smooth) 1;
}
.wa-btn.promo-ready{
  background:linear-gradient(180deg,#ffb340 0%,#ff9f0a 100%);
  color:#1c1c1e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),0 0 0 4px rgba(255,159,10,0.2),0 6px 18px rgba(255,159,10,0.4);
  animation:btnPulse .5s var(--smooth) 1;
}
@keyframes btnPulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}

/* ==== HARGA ==== */
.harga-card{
  border-radius:var(--radius);overflow:hidden;margin-bottom:22px;
  background:var(--surface);border:0.5px solid var(--separator);box-shadow:var(--shadow-1);
}
.harga-section{padding:16px 18px}
.harga-section + .harga-section{border-top:0.5px solid var(--separator)}
.harga-label{font-size:11px;font-weight:700;color:var(--label-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.harga-value{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--label);line-height:1.1}
.harga-value small{font-size:13px;font-weight:600;color:var(--label-3);margin-left:2px}
.harga-note{font-size:12px;color:var(--label-2);margin-top:5px;line-height:1.45}
.harga-cta{
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:15px;background:var(--accent-soft);color:var(--accent-2);
  font-weight:700;font-size:14px;border:none;width:100%;cursor:pointer;
  transition:background .15s;font-family:inherit;letter-spacing:-.01em;
}
.harga-cta:active{background:rgba(255,159,10,0.2)}

/* ==== FILTER ==== */
.filter-bar{padding:14px 0 10px;margin-bottom:4px}
.search-wrap{margin-bottom:10px}
.search-input{
  width:100%;padding:13px 16px;border-radius:12px;
  border:0.5px solid var(--separator);
  background:var(--surface);
  box-shadow:var(--shadow-1);
  font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none;
  color:var(--label);letter-spacing:-.005em;
}
.search-input::placeholder{color:var(--label-3)}
.search-input:focus{outline:none;box-shadow:var(--shadow-1),0 0 0 3px rgba(255,159,10,0.18)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 4px;margin:0 -20px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;padding:9px 16px;border-radius:var(--radius-pill);
  background:var(--surface);border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);font-size:13px;font-weight:600;cursor:pointer;
  color:var(--label-2);transition:all .25s var(--smooth);font-family:inherit;letter-spacing:-.01em;
}
.cat-chip.is-active{
  background:linear-gradient(180deg,#2c2c2e 0%,#1c1c1e 100%);
  color:#fff;border-color:transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.15),0 2px 8px rgba(0,0,0,0.18);
}
.cat-chip:active{transform:scale(.96)}

/* ==== STOK ==== */
.stok-item{
  display:flex;align-items:center;gap:12px;padding:14px 15px;
  border-radius:16px;background:var(--surface);border:0.5px solid var(--separator);
  box-shadow:var(--shadow-1);margin-bottom:10px;cursor:pointer;
  transition:transform .15s var(--spring);color:inherit;text-decoration:none;
}
